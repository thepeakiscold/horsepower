<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only the root-owned service may claim the name. -->
  <policy user="root">
    <allow own="org.horsepower.Daemon"/>
  </policy>

  <!-- Everything below is default-deny on the system bus, so each use is
       granted explicitly. The service exposes read-only measurements; it has
       no methods that change state. -->
  <policy context="default">
    <allow send_destination="org.horsepower.Daemon"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.horsepower.Daemon"
           send_interface="org.freedesktop.DBus.Peer"/>
    <allow send_destination="org.horsepower.Daemon"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.horsepower.Daemon"
           send_interface="org.horsepower.Daemon"/>
  </policy>
</busconfig>
